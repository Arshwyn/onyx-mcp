services:
  onyx-mcp:
    build:
      context: .
    image: onyx-mcp:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${PORT:-10000}:10000"
    env_file: .env
    environment:
      # Keep the in-container port fixed; PORT in .env only changes the host side.
      PORT: "10000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
