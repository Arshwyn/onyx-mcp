services:
  onyx-mcp:
    build:
      context: .
    image: onyx-mcp:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${PORT:-10000}:10000"
    env_file: .env
    environment:
      # Keep the in-container port fixed; PORT in .env only changes the host side.
      PORT: "10000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:10000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
